name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target_platform: mac
            target_format: dmg zip
            target_arch: --x64 --arm64
          - os: windows-latest
            target_platform: win
            target_format: zip
            target_arch: --x64

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 阻止 Windows 检出代码时换行符变动
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      # 2. 修正 app/package.json：将根目录 dependencies 同步合并至 app/package.json，解决依赖缺失报错
      - name: Patch app/package.json for electron-builder
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const rootPkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            if (fs.existsSync("app/package.json")) {
              const appPkg = JSON.parse(fs.readFileSync("app/package.json", "utf8"));
              
              appPkg.main = "build/main/index.js";
              
              // 合并根目录依赖到 app，确保 electron-updater 等能在运行阶段打包进 app/node_modules
              appPkg.dependencies = Object.assign({}, rootPkg.dependencies, appPkg.dependencies);

              appPkg.build = {
                extends: null,
                files: [
                  "build/**/*",
                  "package.json"
                ]
              };

              if (!appPkg.repository) {
                appPkg.repository = {
                  type: "git",
                  url: "https://github.com/${{ github.repository }}.git"
                };
              }

              fs.writeFileSync("app/package.json", JSON.stringify(appPkg, null, 2));
              console.log("Successfully patched app/package.json with root dependencies.");
            }
          '

      # 3. 安装根目录依赖
      - name: Install root dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

      # 4. 补全必要的 Babel 依赖
      - name: Install build tools
        run: yarn add -D @babel/plugin-proposal-private-property-in-object --ignore-engines

      # 5. 安装子目录 app 的全量运行依赖
      - name: Install app dependencies
        run: |
          cd app && yarn install
          npx electron-builder install-app-deps

      # 6. 执行前端编译 (产物到 app/build) 并编译 TS 主进程
      - name: Build Web App & TS Main Process
        run: |
          yarn react-build
          yarn tsc-electron-build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          CI: false
          GENERATE_SOURCEMAP: false

      # 7. 同步构建产物到 app 目录
      - name: Sync build artifacts to app
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("build")) {
              fs.cpSync("build", "app/build", { recursive: true });
              console.log("Successfully copied build/ to app/build/");
            }
          '

      # 8. 执行打包，传入指定的 target_format (如 win zip)
      - name: Package Electron App
        run: npx electron-builder --${{ matrix.target_platform }} ${{ matrix.target_format }} ${{ matrix.target_arch }} --projectDir=app --config.directories.output=../dist --publish never
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      # 9. 收集打包产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: lanzouyun-disk-${{ matrix.os }}
          compression-level: 9
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
