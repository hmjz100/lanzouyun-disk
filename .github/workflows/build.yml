name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target_arch: --x64 --arm64
          - os: windows-latest
            target_arch: --x64

    runs-on: ${{ matrix.os }}

    steps:
      # 强制 Git 检出文件时保持原始的 LF 换行符，防止 Prettier 在 Windows 上报错
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '18.x'
          cache: 'yarn'

      # 构建过程中跳过 ESLint 语法拦截（推荐），并禁用 CI 严格失败机制
      - name: Install dependencies
        run: yarn install --frozen-lockfile
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

      # 安装补充的 babel 依赖
      - name: Install missing build tool
        run: yarn add -D @babel/plugin-proposal-private-property-in-object

      # 构建前端 React 产物及 Electron 主进程脚本
      - name: Build Web App & Main Process
        run: yarn build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          CI: false

      # 结合子目录 app 依赖重新拉取（针对 postinstall 逻辑）
      - name: Prepare electron app dependencies
        run: cd app && yarn install

      # 执行 electron-builder 打包，按系统输出 x64 和 arm64 架构文件
      - name: Package Electron App
        run: npx electron-builder ${{ matrix.target_arch }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      # 上传生成的安装包/压缩包
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanzouyun-disk-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
