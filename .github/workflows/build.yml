name: Build and Release

on:
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            target_platform: mac
            target_arch: --x64 --arm64
          - os: windows-latest
            target_platform: win
            target_arch: --x64

    runs-on: ${{ matrix.os }}

    steps:
      # 1. 阻止 Windows 检出代码时强行转 CRLF 换行
      - name: Configure Git Line Endings
        run: git config --global core.autocrlf false

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'yarn'

      # 2. 清理 app/package.json 里的非法 'build' 节点，避免 electron-builder v3.0+ 报废掉
      - name: Fix app/package.json for electron-builder
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            if (fs.existsSync("app/package.json")) {
              const pkg = JSON.parse(fs.readFileSync("app/package.json", "utf8"));
              delete pkg.build;
              fs.writeFileSync("app/package.json", JSON.stringify(pkg, null, 2));
              console.log("Successfully removed build field from app/package.json");
            }
          '

      # 3. 安装根目录依赖
      - name: Install root dependencies
        run: yarn install --frozen-lockfile --ignore-scripts
        env:
          DISABLE_ESLINT_PLUGIN: 'true'

      # 4. 补全必要的 Babel 插件
      - name: Install build tools
        run: yarn add -D @babel/plugin-proposal-private-property-in-object --ignore-engines

      # 5. 安装子目录 app 的依赖
      - name: Install app dependencies
        run: |
          npx electron-builder install-app-deps
          cd app && yarn install

      # 6. 执行前端编译 (输出到 build/) 并编译 TS 主进程 (输出到 build/main/ 或 app/build/)
      - name: Build Web App & TS Main Process
        run: |
          yarn react-build
          yarn tsc-electron-build
        env:
          DISABLE_ESLINT_PLUGIN: 'true'
          CI: false
          GENERATE_SOURCEMAP: false

      # 7. 关键步骤：同步根目录的构建产物到 app 目录，并确保目录结构符合 electron-builder 的预期
      - name: Sync build artifacts to app
        shell: bash
        run: |
          node -e '
            const fs = require("fs-extra");
            // 将根目录 build 同步到 app/build
            if (fs.existsSync("build")) {
              fs.copySync("build", "app/build");
            }
            // 确保 build/electron.js 或相关入口文件有兼容拷贝
            if (fs.existsSync("app/build/main/index.js") && !fs.existsSync("app/build/electron.js")) {
              fs.copySync("app/build/main/index.js", "app/build/electron.js");
            }
            console.log("Successfully prepared app/build files");
          '

      # 8. 打包：指向 app 目录作为工程上下文进行打包
      - name: Package Electron App
        run: npx electron-builder --${{ matrix.target_platform }} ${{ matrix.target_arch }} --projectDir=app -c.directories.output=../dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_BUILDER_ALLOW_UNRESOLVED_DEPENDENCIES: true

      # 9. 收集打包产物
      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: lanzouyun-disk-${{ matrix.os }}
          path: |
            dist/*.dmg
            dist/*.zip
            dist/*.exe
